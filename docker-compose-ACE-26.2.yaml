version: "3.8"

# Alfresco Community 26.2 stack for the POC (side-by-side with docker-compose.yml / docker-compose-ACE-26.1.yaml).
# Image tags follow Alfresco's reference community-compose.yaml for ACS 26.2.0 (acs-deployment v10.7.0).
# Needs ~10GB RAM (Elasticsearch + Kibana + batch indexing on top of the repository).
# Start with: docker compose -f docker-compose-ACE-26.2.yaml up -d
# Uses the same host ports as the other stacks, so run only one stack at a time.
# Uses its own volumes (*-26-2), so it starts with an empty repository.
#
# Differences from the 25.5 / 26.1 stacks:
#   - Search is Elasticsearch 8 fed by the batch-indexing service. There is no Solr ("search") service anymore.
#   - A Traefik proxy fronts everything on :8080, so the Spring Boot API can keep using http://localhost:8080.
#
# Entry points (all via the proxy):
#   Repository REST API   http://localhost:8080/alfresco/api/-default-/public/alfresco/versions/1
#   Search REST API       http://localhost:8080/alfresco/api/-default-/public/search/versions/1
#   Share                 http://localhost:8080/share
#   Content App (ACA)     http://localhost:8080/content-app
#   Control Center        http://localhost:8080/control-center
#   Traefik dashboard     http://localhost:8888
#   ActiveMQ console      http://localhost:8161   (admin / admin)
#   Kibana                http://localhost:5601
#   Elasticsearch         http://localhost:9200
#   Transform             http://localhost:8090
#   PostgreSQL            localhost:5432          (alfresco / alfresco)
# Default Alfresco login: admin / admin

services:
  proxy:
    image: traefik:3.6
    mem_limit: 128m
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedByDefault=false"
      - "--accesslog=true"
      - "--ping=true"
      - "--entrypoints.web.address=:8080"
      - "--entrypoints.web.transport.respondingTimeouts.readTimeout=20m"
      - "--entrypoints.traefik.address=:8888"
    ports:
      - "8080:8080"
      - "8888:8888"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    security_opt:
      - label=disable # for SELinux hosts
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:17.9
    mem_limit: 512m
    environment:
      POSTGRES_DB: alfresco
      POSTGRES_USER: alfresco
      POSTGRES_PASSWORD: alfresco
    command: postgres -c max_connections=300 -c log_min_messages=LOG
    volumes:
      - pg-data-26-2:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alfresco"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

  activemq:
    image: alfresco/alfresco-activemq:6.2.6-jre17-rockylinux8
    mem_limit: 1g
    environment:
      # ActiveMQ 6.2.x images in ACS 26+ require authentication; the repository below uses the same pair.
      ACTIVEMQ_ADMIN_LOGIN: admin
      ACTIVEMQ_ADMIN_PASSWORD: admin
    ports:
      - "8161:8161" # web console
      - "5672:5672" # AMQP
      - "61616:61616" # OpenWire
      - "61613:61613" # STOMP
    healthcheck:
      test: ["CMD", "/opt/activemq/bin/activemq", "query", "--objname", "type=Broker,brokerName=*,service=Health"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  transform-core-aio:
    image: alfresco/alfresco-transform-core-aio:5.4.3
    mem_limit: 1536m
    environment:
      JAVA_OPTS: "-XX:MinRAMPercentage=50 -XX:MaxRAMPercentage=80"
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/ready"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      activemq:
        condition: service_healthy

  elasticsearch:
    image: elasticsearch:8.17.10
    environment:
      xpack.security.enabled: "false"
      discovery.type: single-node
      ES_JAVA_OPTS: "-Xms512m -Xmx1g"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    cap_add:
      - IPC_LOCK
    volumes:
      - es-data-26-2:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
      - "9300:9300"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -Eq '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  kibana:
    image: kibana:8.17.10
    mem_limit: 1g
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null -f http://localhost:5601/api/status"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    depends_on:
      elasticsearch:
        condition: service_healthy

  alfresco:
    image: alfresco/alfresco-content-repository-community:26.2.0
    mem_limit: 1900m
    environment:
      # Default keystore baked into the image; passwords are Alfresco's published defaults.
      JAVA_TOOL_OPTIONS: >-
        -Dencryption.keystore.type=JCEKS
        -Dencryption.cipherAlgorithm=DESede/CBC/PKCS5Padding
        -Dencryption.keyAlgorithm=DESede
        -Dencryption.keystore.location=/usr/local/tomcat/shared/classes/alfresco/extension/keystore/keystore
        -Dmetadata-keystore.password=mp6yc0UD9e
        -Dmetadata-keystore.aliases=metadata
        -Dmetadata-keystore.metadata.password=oKIWzVdEdA
        -Dmetadata-keystore.metadata.algorithm=DESede
      JAVA_OPTS: >-
        -Ddb.driver=org.postgresql.Driver
        -Ddb.username=alfresco
        -Ddb.password=alfresco
        -Ddb.url=jdbc:postgresql://postgres:5432/alfresco
        -Dindex.subsystem.name=elasticsearch
        -Delasticsearch.createIndexIfNotExists=true
        -Delasticsearch.host=elasticsearch
        -Delasticsearch.port=9200
        -Dsolr.secureComms=secret
        -Dsolr.sharedSecret=alfresco-poc-shared-secret
        -Dshare.host=localhost
        -Dshare.port=8080
        -Dalfresco.host=localhost
        -Dalfresco.port=8080
        -Dcsrf.filter.enabled=false
        -Daos.baseUrlOverwrite=http://localhost:8080/alfresco/aos
        -Dmessaging.broker.url="failover:(nio://activemq:61616)?timeout=3000&jms.useCompression=true"
        -Dmessaging.broker.username=admin
        -Dmessaging.broker.password=admin
        -Ddeployment.method=DOCKER_COMPOSE
        -DlocalTransform.core-aio.url=http://transform-core-aio:8090/
        -XX:MinRAMPercentage=50
        -XX:MaxRAMPercentage=80
    volumes:
      - acs-data-26-2:/usr/local/tomcat/alf_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/alfresco/api/-default-/public/alfresco/versions/1/probes/-ready-"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 2m
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.alfresco.rule=PathPrefix(`/alfresco`)"
      - "traefik.http.routers.alfresco.entrypoints=web"
      - "traefik.http.services.alfresco.loadbalancer.server.port=8080"
      # Allow large uploads (5 GB)
      - "traefik.http.middlewares.limit.buffering.maxRequestBodyBytes=5368709120"
      - "traefik.http.routers.alfresco.middlewares=limit"
      # Send the bare root to Share
      - "traefik.http.routers.root.rule=Path(`/`)"
      - "traefik.http.routers.root.entrypoints=web"
      - "traefik.http.routers.root.middlewares=root-redirect"
      - "traefik.http.routers.root.service=alfresco"
      - "traefik.http.middlewares.root-redirect.redirectregex.regex=^(https?://[^/]+)/?$$"
      - "traefik.http.middlewares.root-redirect.redirectregex.replacement=$${1}/share"
    depends_on:
      postgres:
        condition: service_healthy
      activemq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      transform-core-aio:
        condition: service_healthy

  batch-indexing:
    image: alfresco/alfresco-elasticsearch-batch-indexing:5.7.0
    mem_limit: 1g
    environment:
      JAVA_OPTS: "-Xms256m -Xmx768m"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/alfresco
      SPRING_DATASOURCE_USERNAME: alfresco
      SPRING_DATASOURCE_PASSWORD: alfresco
      SPRING_ELASTICSEARCH_REST_URIS: http://elasticsearch:9200
      ALFRESCO_ACCEPTEDCONTENTMEDIATYPESCACHE_BASEURL: http://transform-core-aio:8090/transform/config
      ALFRESCO_ACS_URL: http://alfresco:8080
      ALFRESCO_CONTENT_TRANSFORM_SHAREDSECRET: alfresco-poc-shared-secret
      ALFRESCO_REINDEX_CONTINUOUS_POLLINGINTERVAL: 15s
      ALFRESCO_REINDEX_CONTINUOUS_CATCHUPPOLLINGINTERVAL: 1s
      ALFRESCO_REINDEX_CONTINUOUS_MAXWINDOW: 30m
      ALFRESCO_REINDEX_CONTINUOUS_OVERLAP: 10m
    depends_on:
      elasticsearch:
        condition: service_healthy
      alfresco:
        condition: service_healthy
      transform-core-aio:
        condition: service_healthy

  share:
    image: alfresco/alfresco-share:26.2.0
    mem_limit: 1g
    environment:
      REPO_HOST: alfresco
      REPO_PORT: "8080"
      CSRF_FILTER_ORIGIN: http://localhost:8080
      CSRF_FILTER_REFERER: http://localhost:8080/.*
      ALFRESCO_HOST: localhost
      ALFRESCO_PORT: "8080"
      ALFRESCO_CONTEXT: alfresco
      ALFRESCO_PROTOCOL: http
      JAVA_OPTS: "-XX:MinRAMPercentage=50 -XX:MaxRAMPercentage=80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/share"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.share.rule=PathPrefix(`/share`)"
      - "traefik.http.routers.share.entrypoints=web"
      - "traefik.http.routers.share.middlewares=limit"
      - "traefik.http.services.share.loadbalancer.server.port=8080"
    depends_on:
      alfresco:
        condition: service_healthy

  content-app:
    image: alfresco/alfresco-content-app:8.0.0
    mem_limit: 128m
    environment:
      APP_BASE_SHARE_URL: http://localhost:8080/aca/#/preview/s
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.content-app.rule=PathPrefix(`/content-app`)"
      - "traefik.http.routers.content-app.entrypoints=web"
      - "traefik.http.routers.content-app.middlewares=content-app-strip,content-app-slash"
      - "traefik.http.middlewares.content-app-strip.stripprefix.prefixes=/content-app"
      - "traefik.http.middlewares.content-app-slash.replacepathregex.regex=^$$"
      - "traefik.http.middlewares.content-app-slash.replacepathregex.replacement=/"
      - "traefik.http.services.content-app.loadbalancer.server.port=8080"
    depends_on:
      alfresco:
        condition: service_healthy

  control-center:
    image: quay.io/alfresco/alfresco-control-center:11.0.0
    mem_limit: 128m
    environment:
      APP_CONFIG_PROVIDER: ECM
      APP_CONFIG_AUTH_TYPE: BASIC
      BASE_PATH: ./
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.control-center.rule=PathPrefix(`/control-center`) || PathPrefix(`/admin`)"
      - "traefik.http.routers.control-center.entrypoints=web"
      - "traefik.http.routers.control-center.middlewares=control-center-strip,content-app-slash"
      - "traefik.http.middlewares.control-center-strip.stripprefix.prefixes=/control-center,/admin"
      - "traefik.http.services.control-center.loadbalancer.server.port=8080"
    depends_on:
      alfresco:
        condition: service_healthy

volumes:
  pg-data-26-2:
  acs-data-26-2:
  es-data-26-2:
