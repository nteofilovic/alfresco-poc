<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zapis sign in</title><link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"><style>
:root{--pine:#0F3D2E;--forest:#1E6B52;--fern:#2B8064;--sage:#A8C9B8;--mist:#E7EFEA;--ink:#142019;--ink2:#5A6862;--line:#D5DED9;--paper:#fff}
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{font-family:"Inter Tight",system-ui,sans-serif;color:var(--ink);overflow:hidden}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-.02em}
.mark{width:30px;height:30px;border-radius:8px;background:var(--forest);color:#fff;display:grid;place-items:center;font-size:15px;font-weight:800}
.fm{width:100%;max-width:380px}
.fm h1{font-size:30px;font-weight:700;letter-spacing:-.03em}
.fm .lead{color:var(--ink2);margin-top:8px;font-size:15px;line-height:1.5}
.fm form{margin-top:28px;display:grid;gap:18px}
.fm label{display:block;font-size:13.5px;font-weight:600;margin-bottom:7px}
.fm .row{display:flex;justify-content:space-between;align-items:baseline}
.fm .row a{font-size:13.5px;color:var(--forest);font-weight:600;text-decoration:none}
.fm input[type=text],.fm input[type=password]{width:100%;height:48px;border:1px solid var(--line);border-radius:10px;padding:0 14px;font:inherit;font-size:15.5px;color:var(--ink);background:#fff}
.fm input:focus{outline:none;border-color:var(--forest);box-shadow:0 0 0 4px rgba(30,107,82,.15)}
.fm .check{display:flex;gap:9px;align-items:center;font-size:14px;font-weight:400;color:var(--ink2);margin:0}
.fm .check input{width:17px;height:17px;accent-color:var(--forest)}
.fm button{height:50px;border:0;border-radius:10px;background:var(--forest);color:#fff;font:inherit;font-weight:600;font-size:15.5px;cursor:pointer}
.fm button:hover{background:var(--pine)}
.foot{font-size:13px;color:var(--ink2)}
.split{display:grid;grid-template-columns:1.25fr 1fr;height:100vh}
.right{display:flex;flex-direction:column;padding:40px 56px;background:#fff}
.right .mid{flex:1;display:flex;align-items:center;justify-content:center}
@media(max-width:900px){body{overflow:auto}.split{grid-template-columns:1fr}.art{display:none!important}}

.art{background:linear-gradient(160deg,#F3F7F4,#DCE9E1);padding:48px 56px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.art svg{width:100%;max-width:720px;align-self:center;filter:drop-shadow(0 30px 40px rgba(15,61,46,.18))}
.art h2{font-size:40px;font-weight:700;letter-spacing:-.035em;line-height:1.05;color:var(--pine);max-width:18ch}
.stats{display:flex;gap:36px;margin-top:18px}.stats b{display:block;font-size:24px;color:var(--forest);letter-spacing:-.02em}.stats span{font-size:13px;color:var(--ink2)}
