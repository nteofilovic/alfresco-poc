version: "3.8"

# Alfresco Community 26.1 stack for the POC (side-by-side with docker-compose.yml, which stays on 25.5).
# Image tags follow Alfresco's reference community-compose.yaml for ACS 26.1.0 (acs-deployment v10.3.0).
# Needs ~6-8GB RAM. Start with: docker compose -f docker-compose-ACE-26.1.yaml up -d
# Uses the same host ports as docker-compose.yml, so run only one of the two stacks at a time.
# Uses its own volumes (*-26-1), so it starts with an empty repository and does not touch 25.5 data.
# Alfresco REST API: http://localhost:8080/alfresco/api/-default-/public/alfresco/versions/1
# Default admin login: admin / admin

services:
  postgres:
    image: postgres:17.9
    environment:
      POSTGRES_DB: alfresco
      POSTGRES_USER: alfresco
      POSTGRES_PASSWORD: alfresco
    command: postgres -c max_connections=300 -c log_min_messages=LOG
    volumes:
      - pg-data-26-1:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alfresco"]
      interval: 5s
      timeout: 5s
      retries: 20

  activemq:
    image: alfresco/alfresco-activemq:6.2.1-jre17-rockylinux8
    environment:
      # ActiveMQ 6.2.x images in ACS 26+ require authentication; the repository below uses the same pair.
      ACTIVEMQ_ADMIN_LOGIN: admin
      ACTIVEMQ_ADMIN_PASSWORD: admin
    ports:
      - "8161:8161" # web console
    healthcheck:
      test: ["CMD", "/opt/activemq/bin/activemq", "query", "--objname", "type=Broker,brokerName=*,service=Health"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  transform-core-aio:
    image: alfresco/alfresco-transform-core-aio:5.4.0
    environment:
      JAVA_OPTS: "-XX:MinRAMPercentage=50 -XX:MaxRAMPercentage=80"
    ports:
      - "8090:8090"
    depends_on:
      activemq:
        condition: service_healthy

  alfresco:
    image: alfresco/alfresco-content-repository-community:26.1.0
    environment:
      # Default keystore baked into the image; passwords are Alfresco's published defaults.
      JAVA_TOOL_OPTIONS: >-
        -Dencryption.keystore.type=JCEKS
        -Dencryption.cipherAlgorithm=DESede/CBC/PKCS5Padding
        -Dencryption.keyAlgorithm=DESede
        -Dencryption.keystore.location=/usr/local/tomcat/shared/classes/alfresco/extension/keystore/keystore
        -Dmetadata-keystore.password=mp6yc0UD9e
        -Dmetadata-keystore.aliases=metadata
        -Dmetadata-keystore.metadata.password=oKIWzVdEdA
        -Dmetadata-keystore.metadata.algorithm=DESede
      JAVA_OPTS: >-
        -Ddb.driver=org.postgresql.Driver
        -Ddb.username=alfresco
        -Ddb.password=alfresco
        -Ddb.url=jdbc:postgresql://postgres:5432/alfresco
        -Dsolr.host=search
        -Dsolr.port=8983
        -Dsolr.secureComms=secret
        -Dsolr.sharedSecret=alfresco-poc-shared-secret
        -Dsolr.base.url=/solr
        -Dindex.subsystem.name=solr6
        -Dshare.host=localhost
        -Dshare.port=8080
        -Dalfresco.host=localhost
        -Dalfresco.port=8080
        -Dcsrf.filter.enabled=false
        -Daos.baseUrlOverwrite=http://localhost:8080/alfresco/aos
        -Dmessaging.broker.url="failover:(nio://activemq:61616)?timeout=3000&jms.useCompression=true"
        -Dmessaging.broker.username=admin
        -Dmessaging.broker.password=admin
        -Ddeployment.method=DOCKER_COMPOSE
        -DlocalTransform.core-aio.url=http://transform-core-aio:8090/
        -XX:MinRAMPercentage=50
        -XX:MaxRAMPercentage=80
    volumes:
      - acs-data-26-1:/usr/local/tomcat/alf_data
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/alfresco/api/-default-/public/alfresco/versions/1/probes/-ready-"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 2m
    depends_on:
      postgres:
        condition: service_healthy
      activemq:
        condition: service_healthy
      transform-core-aio:
        condition: service_started

  search:
    image: alfresco/alfresco-search-services:2.0.18
    environment:
      SOLR_ALFRESCO_HOST: "alfresco"
      SOLR_ALFRESCO_PORT: "8080"
      SOLR_SOLR_HOST: "search"
      SOLR_SOLR_PORT: "8983"
      SOLR_CREATE_ALFRESCO_DEFAULTS: "alfresco,archive"
      ALFRESCO_SECURE_COMMS: "secret"
      JAVA_TOOL_OPTIONS: "-Dalfresco.secureComms.secret=alfresco-poc-shared-secret"
    volumes:
      - solr-data-26-1:/opt/alfresco-search-services/data
    ports:
      - "8983:8983"
    depends_on:
      alfresco:
        condition: service_healthy

volumes:
  pg-data-26-1:
  acs-data-26-1:
  solr-data-26-1:
